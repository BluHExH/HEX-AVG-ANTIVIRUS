name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/ -v

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: hex-avg
          - os: windows-latest
            artifact: hex-avg.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Build with PyInstaller
        run: pyinstaller hex_avg.spec --clean --noconfirm
      - name: Verify executable (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/hex-avg
          ./dist/hex-avg --version || ./dist/hex-avg --help
      - name: Verify executable (Windows)
        if: runner.os == 'Windows'
        run: |
          .\dist\hex-avg.exe --version
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hex-avg-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/hex-avg-ubuntu-latest/hex-avg
            artifacts/hex-avg-windows-latest/hex-avg.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
